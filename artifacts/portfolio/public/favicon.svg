<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGrad)"/>

  <!-- Subtle cyan border -->
  <rect x="3" y="3" width="174" height="174" rx="34" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>

  <!-- >_ terminal symbol with glow -->
  <text
    x="90"
    y="116"
    font-family="'Courier New', Courier, monospace"
    font-weight="900"
    font-size="68"
    fill="#00d4ff"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="-2"
  >&gt;_</text>
</svg>
